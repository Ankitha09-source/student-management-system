<body>
    <nav class="navbar">
        <a href="/index.html" class="brand">
            <div class="brand-icon">E</div>
            <span>EduManage</span>
        </a>

        <span class="nav-tag">Student Registration</span>
    </nav>

    <main>
        <div class="signup-box">
            <div class="student-icon">🎓</div>

            <h1>Create Student Account</h1>

            <p class="subtitle">
                Register to access your student profile,
                course information and academic results.
            </p>

            <form id="signupForm" autocomplete="off">
                <label for="email">Registered Student Email</label>

                <input
                    type="email"
                    id="email"
                    name="student-registration-email"
                    placeholder="Enter the email registered by your admin"
                    autocomplete="off"
                    required>

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="student-registration-password"
                    placeholder="Create a password (minimum 8 characters)"
                    minlength="8"
                    autocomplete="new-password"
                    required>

                <label for="confirmPassword">Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="student-confirm-password"
                    placeholder="Enter your password again"
                    minlength="8"
                    autocomplete="new-password"
                    required>

                <button type="submit" id="signupButton">
                    Create Student Account
                </button>
            </form>

            <p id="message" role="status" aria-live="polite"></p>

            <p class="login-link">
                Already have an account?
                <a href="/student-login.html">Student Login</a>
            </p>

            <a class="back-link" href="/index.html">
                ← Back to Welcome Page
            </a>
        </div>
    </main>

    <footer>
        © 2026 EduManage · Student Management System
    </footer>

    <script>
        const form = document.getElementById("signupForm");
        const message = document.getElementById("message");
        const button = document.getElementById("signupButton");

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const email = document.getElementById("email")
                .value.trim().toLowerCase();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            message.textContent = "";
            message.style.color = "#dc2626";

            if (password.length < 8) {
                message.textContent =
                    "Password must contain at least 8 characters.";
                return;
            }

            if (password !== confirmPassword) {
                message.textContent =
                    "Passwords do not match. Please try again.";
                document.getElementById("confirmPassword").focus();
                return;
            }

            button.disabled = true;
            button.textContent = "Creating account...";

            try {
                const response = await fetch(
                    "/api/auth/register/student",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Accept": "application/json"
                        },
                        credentials: "same-origin",
                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    }
                );

                const responseText = await response.text();
                let data = {};

                if (responseText) {
                    try {
                        data = JSON.parse(responseText);
                    } catch {
                        data = { message: responseText };
                    }
                }

                if (!response.ok) {
                    throw new Error(
                        data.message ||
                        data.error ||
                        (response.status === 401
                            ? "Registration was unauthorized. Check your Spring Security configuration."
                            : response.status === 403
                                ? "Registration was forbidden. Check your security settings."
                                : "Registration failed. Make sure your email is already registered by the administrator.")
                    );
                }

                message.style.color = "#15803d";
                message.textContent =
                    "Student account created successfully! Redirecting to login...";

                form.reset();
                button.textContent = "Account Created";

                setTimeout(function() {
                    window.location.replace("/student-login.html");
                }, 1200);

            } catch (error) {
                message.style.color = "#dc2626";
                message.textContent =
                    error.message ||
                    "Unable to connect to the server. Please try again.";

                button.disabled = false;
                button.textContent = "Create Student Account";
            }
        });
    </script>
</body>
</html>
